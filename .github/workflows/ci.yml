name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "GCC Debug (Warnings as Errors)"
            c_compiler: gcc
            cxx_compiler: g++
            build_type: Debug
            warnings_as_errors: "ON"
            enable_asan: "OFF"
            enable_ubsan: "OFF"
          - name: "GCC Release"
            c_compiler: gcc
            cxx_compiler: g++
            build_type: Release
            warnings_as_errors: "ON"
            enable_asan: "OFF"
            enable_ubsan: "OFF"
          - name: "Clang Debug (ASan + UBSan)"
            c_compiler: clang
            cxx_compiler: clang++
            build_type: Debug
            warnings_as_errors: "ON"
            enable_asan: "ON"
            enable_ubsan: "ON"

    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      VCPKG_DEFAULT_BINARY_CACHE: /home/runner/.cache/vcpkg/archives
      VCPKG_BINARY_SOURCES: "clear;files,/home/runner/.cache/vcpkg/archives,readwrite"
      FETCHCONTENT_BASE_DIR: /home/runner/.cache/fetchcontent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create cache directories
        run: |
          mkdir -p ~/.cache/vcpkg/archives ~/.cache/fetchcontent ~/.cache/ccache

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache

      - name: Cache compiler outputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ matrix.c_compiler }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.c_compiler }}-${{ matrix.build_type }}-

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ matrix.c_compiler }}-${{ matrix.build_type }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ matrix.c_compiler }}-${{ matrix.build_type }}-
            ${{ runner.os }}-vcpkg-

      - name: Cache Tree-sitter grammars
        uses: actions/cache@v4
        with:
          path: ~/.cache/fetchcontent
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('cmake/TreeSitterGrammar.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'

      - name: Configure CMake
        env:
          CC: ${{ matrix.c_compiler }}
          CXX: ${{ matrix.cxx_compiler }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCODELENSES_BUILD_TESTS=ON \
            -DCODELENSES_WARNINGS_AS_ERRORS=${{ matrix.warnings_as_errors }} \
            -DCODELENSES_ENABLE_ASAN=${{ matrix.enable_asan }} \
            -DCODELENSES_ENABLE_UBSAN=${{ matrix.enable_ubsan }} \
            -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE_DIR }} \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake

      - name: Zero ccache statistics
        run: |
          ccache -z

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Show ccache statistics
        run: |
          ccache -s

      - name: Run Tests
        run: |
          ctest --test-dir build --output-on-failure --parallel 2
