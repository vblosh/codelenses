name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "GCC Release"
            c_compiler: gcc
            cxx_compiler: g++
            build_type: Release
            warnings_as_errors: "ON"
            enable_asan: "OFF"
            enable_ubsan: "OFF"
          - name: "Clang Debug (ASan + UBSan)"
            c_compiler: clang
            cxx_compiler: clang++
            build_type: Debug
            warnings_as_errors: "ON"
            enable_asan: "ON"
            enable_ubsan: "ON"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'

      - name: Configure CMake
        env:
          CC: ${{ matrix.c_compiler }}
          CXX: ${{ matrix.cxx_compiler }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCODELENSES_BUILD_TESTS=ON \
            -DCODELENSES_WARNINGS_AS_ERRORS=${{ matrix.warnings_as_errors }} \
            -DCODELENSES_ENABLE_ASAN=${{ matrix.enable_asan }} \
            -DCODELENSES_ENABLE_UBSAN=${{ matrix.enable_ubsan }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Run Tests
        run: |
          ctest --test-dir build --output-on-failure
